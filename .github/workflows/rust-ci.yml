#
# CI gate for the Rust crate. Runs on ubuntu-latest and macos-latest.
# Validates: cargo fmt --check, cargo clippy with -D warnings, clippy with
# unwrap_used and expect_used denied outside tests, cargo nextest, doctests
# and cargo audit. Adapted from pragmatic-engineer/playbook rust-ci.yml.

name: rust-ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  # Daily full matrix on main. The merge queue runs Linux only, so this
  # catches a platform-only break within a day.
  schedule:
    - cron: "17 5 * * *"

permissions: {}

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      CARGO_AUDIT_VERSION: "0.22.2"
      # Smaller target dir (no debuginfo, no incremental data) means a faster
      # cache restore and faster links.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        if: runner.os == 'Linux'
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            crates.io:443
            github.com:443
            index.crates.io:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: ${{ !(github.event_name == 'merge_group' && runner.os == 'macOS') }}

      - name: Cache cargo registry and build output
        if: ${{ !(github.event_name == 'merge_group' && runner.os == 'macOS') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-build-test-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-build-test-${{ runner.os }}-

      - name: rustc --version
        if: ${{ !(github.event_name == 'merge_group' && runner.os == 'macOS') }}
        run: rustc --version

      - name: Ensure rustfmt and clippy components
        if: ${{ !(github.event_name == 'merge_group' && runner.os == 'macOS') }}
        run: rustup component add rustfmt clippy

      - name: cargo fmt --check
        if: ${{ !(github.event_name == 'merge_group' && runner.os == 'macOS') }}
        run: cargo fmt --check

      - name: cargo clippy
        if: ${{ !(github.event_name == 'merge_group' && runner.os == 'macOS') }}
        run: cargo clippy --all-targets -- -D warnings

      # Non-test code must not panic on bad input.
      - name: cargo clippy (no unwrap or expect outside tests)
        if: ${{ !(github.event_name == 'merge_group' && runner.os == 'macOS') }}
        run: cargo clippy --lib --bins -- -D warnings -D clippy::unwrap_used -D clippy::expect_used

      - name: Install cargo-nextest
        if: ${{ !(github.event_name == 'merge_group' && runner.os == 'macOS') }}
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: nextest@0.9.145

      - name: cargo nextest run
        if: ${{ !(github.event_name == 'merge_group' && runner.os == 'macOS') }}
        run: cargo nextest run --config-file .github/nextest.toml --profile ci

      # nextest does not run doctests.
      - name: cargo test --doc
        if: ${{ !(github.event_name == 'merge_group' && runner.os == 'macOS') }}
        run: cargo test --doc

      - name: Cache cargo-audit binary
        if: ${{ !(github.event_name == 'merge_group' && runner.os == 'macOS') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}

      - name: cargo audit
        if: ${{ !(github.event_name == 'merge_group' && runner.os == 'macOS') }}
        run: |
          if [ ! -x "$HOME/.cargo/bin/cargo-audit" ]; then
            cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
          fi
          cargo audit

      # Saved only after a push to main. PR and queue runs restore the main
      # cache and skip the save.
      - name: Save cargo registry and build output
        if: github.event_name == 'push' && success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-build-test-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
