[package]
name = "playbook-telemetry"
version = "0.1.3"
edition = "2021"
description = "Token and cost usage dashboard for Claude Code sessions: a terminal view, reports and an optional telemetry receiver"
license = "Apache-2.0"
repository = "https://github.com/pragmatic-engineer/playbook-telemetry"
publish = false

[lib]
name = "playbook_telemetry"
path = "src/lib.rs"

[[bin]]
name = "playbook-telemetry"
path = "src/main.rs"

[[bin]]
name = "pbtop"
path = "src/bin/pbtop.rs"

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
libc = "=0.2.189"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }

[lints.clippy]
uninlined_format_args = "warn"
manual_let_else = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
opt-level = "s"
strip = true
lto = "fat"
codegen-units = 1

# SQLite is C code that debug builds compile with -O0. Build it optimized in
# the dev and test profiles so tests that open a database stay fast.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
